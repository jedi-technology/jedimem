name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.12"]
        exclude:
          - os: macos-latest
            python: "3.9"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0          # importers read git history
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: configure git (staging ref writes need an identity)
        run: |
          git config --global user.email ci@example.com
          git config --global user.name CI
          git config --global init.defaultBranch main
      - run: python3 tests/test_jedimem.py

  self-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: memory files are valid
        run: ./bin/jedimem lint
      - name: compiled instruction files are not stale
        run: ./bin/jedimem compile --check
      - name: no runtime dependencies
        run: |
          if grep -qE '^\s*(import|from)\s+(?!jedimem)' -P src/jedimem/*.py \
             | grep -vE 'argparse|dataclasses|fnmatch|hashlib|os|pathlib|re|subprocess|sys|tempfile|time|importlib|threading|__future__|jedimem'; then
            echo "unexpected import (stdlib only, by design)"; exit 1
          fi
