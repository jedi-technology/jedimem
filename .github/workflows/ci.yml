name: ci
on: [push, pull_request]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0          # importers read git history
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: configure git (staging-ref writes need an identity)
        run: |
          git config --global user.email ci@example.com
          git config --global user.name CI
          git config --global init.defaultBranch main
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --release

  self-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: memory files are valid
        run: ./target/release/jedimem lint
      - name: compiled instruction files are not stale
        run: ./target/release/jedimem compile --check
      - name: repo format matches the binary
        # Catches someone landing memories in a format the rest of the team
        # cannot read yet.
        run: ./target/release/jedimem migrate --check
      - name: session-start honours the fail-open contract
        run: |
          set -e
          for dir in . /tmp; do
            ( cd "$dir" && "$GITHUB_WORKSPACE/target/release/jedimem" session-start ) \
              || { echo "session-start must always exit 0 (failed in $dir)"; exit 1; }
          done
      - name: dependency budget
        run: |
          # Supply chain is threat T1 in SECURITY.md. Keep direct deps few and
          # justified; fail loudly if someone adds one without discussion.
          # --color never matters: CARGO_TERM_COLOR=always injects ANSI escapes
          # that break a line-anchored grep. `|| true` matters because grep
          # exits non-zero on a zero count, which `bash -e` treats as failure.
          cargo tree --depth 1 --color never | tail -n +2
          n=$(cargo tree --depth 1 --color never | tail -n +2 | grep -c '^[├└]' || true)
          echo "direct dependencies: $n"
          test "$n" -ge 1 || { echo "dependency count looks wrong: $n"; exit 1; }
          test "$n" -le 5 || { echo "too many direct dependencies"; exit 1; }
