name: ci
on: [push, pull_request]
jobs:
  compiled-not-stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: compiled instruction files are up to date
        run: ./bin/jedimem-compile --check
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - run: sh tests/test_compile.sh
